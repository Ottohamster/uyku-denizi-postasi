<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Uyku Denizi Postası</title>
<meta name="theme-color" content="#1f4e5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uyku Denizi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{height:100%;margin:0}
  body{background:#e9dcbf;color:#2a2018;font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:112px;height:112px;border-radius:24px;box-shadow:0 6px 18px rgba(42,32,24,.25)}
  h1{font-size:1.7rem;margin:18px 0 6px;letter-spacing:.02em}
  p{margin:0;color:#5a4a38;font-style:italic}
  a{color:#9b2d20}
  @media (prefers-reduced-motion:no-preference){img{animation:b 2.4s ease-in-out infinite}@keyframes b{50%{transform:translateY(-6px) rotate(-2deg)}}}
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Uyku Denizi Postası</h1>
  <p id="d">Son sayı getiriliyor…</p>
  <noscript><p><a href="sayilar/">Sayılar</a></p></noscript>
</main>
<script>
(function(){
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  var d=document.getElementById("d");
  function git(list){
    var s=(list.sayilar||[]).slice().sort(function(a,b){return b.sayi-a.sayi;})[0];
    if(!s){ d.textContent="Henüz sayı yok."; return; }
    location.replace(s.html);
  }
  fetch("sayilar.json",{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(git)
  .catch(function(){
    fetch("sayilar.json").then(function(r){return r.json();}).then(git)
    .catch(function(){ d.innerHTML='Bağlantı yok ve kayıtlı sayı bulunamadı. <a href="index.html">Yeniden dene</a>'; });
  });
})();
</script>
</body>
</html>
